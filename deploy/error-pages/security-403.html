<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Acceso restringido | ReMicos</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; color: #263238; background: #f4f7f8; }
    main { width: 100%; max-width: 900px; overflow: hidden; text-align: center; background: #fff; border-radius: 16px; box-shadow: 0 10px 35px rgba(0,0,0,.10); }
    .illustration { min-height: 240px; display: grid; place-items: center; background: #dceff6; }
    .illustration span { padding: .15em .25em; border: 10px solid #fff; border-radius: 28px; color: #1976d2; background: #fff; box-shadow: 0 12px 28px rgba(25,118,210,.12); font-size: clamp(5rem, 20vw, 10rem); font-weight: 900; letter-spacing: -.08em; line-height: 1; transform: rotate(-5deg); }
    .contenido { padding: 32px 24px 38px; }
    h1 { margin: 0 0 12px; font-size: clamp(1.6rem, 4vw, 2.2rem); }
    p { margin: 0 auto 26px; max-width: 600px; line-height: 1.6; }
    a { display: inline-block; padding: 12px 22px; color: #fff; font-weight: 600; text-decoration: none; background: #1976d2; border-radius: 8px; }
    a:hover, a:focus-visible { background: #125ca4; }
    a:focus-visible { outline: 3px solid #263238; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="illustration" aria-hidden="true"><span>403</span></div>
    <div class="contenido">
      <h1>Acceso restringido</h1>
      <p>No es posible mostrar este contenido. Si necesitas una política o documento de ReMicos, vuelve al sitio principal y utiliza sus enlaces oficiales.</p>
      <a href="https://www.remicos.com.co/">Ir al sitio principal</a>
    </div>
  </main>
</body>
</html>
